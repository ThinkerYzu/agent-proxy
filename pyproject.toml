[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-proxy"
version = "0.1.0"
description = "Turn-aware JSON stream around an interactive claude TUI or codex app-server."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kui-Feng Lee" }]
dependencies = [
    "pyte>=0.8.2",
    "ptyprocess>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agent-proxy = "agentproxy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a live `claude` or `codex` binary on PATH; slow",
    "slow: long-running tests (e.g. a soak); opt in with `-m slow`",
]
